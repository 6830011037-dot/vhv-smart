name: Cloudflare Workers Build

on:
  push:
    branches: ["patient-access", "cloudflare-workers"]
  pull_request:
    branches: ["patient-access"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npx --yes wrangler@4.131.2 deploy --dry-run
